name: Verify macOS

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify selected toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
          echo "ARGUS_SWIFT=$(xcrun --find swift)" >> "$GITHUB_ENV"
      - name: Check versioned change notes
        shell: bash
        run: python3 scripts/check-version.py
      - name: Verify packaging fixture path portability
        shell: bash
        run: bash scripts/test-packaging-paths.sh
      - name: Test and verify development bundle
        shell: bash
        run: bash scripts/verify.sh
